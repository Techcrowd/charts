<div
  class="co-bar-chart"
  [class.co-bar-chart--loading]="loading"
  [class.co-bar-chart--hovering]="hoveredSeriesIndex() !== -1 && !isLegendHover()"
>
  <!-- Chart Container -->
  <div class="co-bar-chart__chart-wrapper">
    @if (loading) {
      <div class="co-bar-chart__skeleton" [style.height.px]="height">
        <!-- Y Axis skeleton (categories) -->
        <div class="co-bar-chart__skeleton-yaxis">
          @for (row of skeletonRows; track row) {
            <span class="co-bar-chart__skeleton-yaxis-label"></span>
          }
        </div>
        <!-- Bars skeleton -->
        <div class="co-bar-chart__skeleton-bars">
          @for (row of skeletonRows; track row) {
            <div class="co-bar-chart__skeleton-row">
              @for (s of skeletonSeriesItems; track s) {
                <div
                  class="co-bar-chart__skeleton-bar"
                  [style.width.%]="40 + (row * 10) + (s * 5) % 50"
                ></div>
              }
            </div>
          }
        </div>
      </div>
    } @else {
      <div class="co-bar-chart__chart-container">
        <apx-chart
          #chart
          [series]="chartSeries()"
          [chart]="chartConfig"
          [colors]="chartColors()"
          [dataLabels]="dataLabelsConfig"
          [plotOptions]="plotOptionsConfig"
          [tooltip]="tooltipConfig"
          [states]="statesConfig"
          [legend]="legendConfig"
          [xaxis]="xAxisConfig"
          [yaxis]="yAxisConfig"
          [grid]="gridConfig"
          [stroke]="strokeConfig"
          [fill]="fillConfig"
          [responsive]="responsiveConfig"
        />
      </div>
    }
  </div>

  <!-- Legend -->
  @if (showLegend) {
    @if (loading) {
      <div class="co-chart-legend-skeleton">
        @for (i of skeletonSeriesItems; track i) {
          <div class="co-chart-legend-skeleton__item">
            <span class="co-chart-legend-skeleton__dot"></span>
            <span class="co-chart-legend-skeleton__text"></span>
          </div>
        }
      </div>
    } @else {
      <co-chart-legend
        [items]="legendItems()"
        [showValues]="false"
        [valueFormat]="valueFormat"
        (itemHover)="onLegendItemHover($event)"
        (itemLeave)="onLegendItemLeave()"
        (itemClick)="onLegendItemClick($event.index)"
      />
    }
  }
</div>
