<div
  class="co-column-chart"
  [class.co-column-chart--loading]="loading"
  [class.co-column-chart--hovering]="hoveredSeriesIndex() !== -1 && !isLegendHover()"
  [class.co-column-chart--sm]="size === 'sm'"
  [class.co-column-chart--md]="size === 'md'"
  [class.co-column-chart--lg]="size === 'lg'"
  [class.co-column-chart--auto]="size === 'auto'"
>
  <!-- Chart Container -->
  <div class="co-column-chart__chart-wrapper">
    @if (loading) {
      <div class="co-column-chart__skeleton" [style.height.px]="computedHeight">
        <!-- Y Axis skeleton -->
        <div class="co-column-chart__skeleton-yaxis">
          <span class="co-column-chart__skeleton-yaxis-label"></span>
          <span class="co-column-chart__skeleton-yaxis-label"></span>
          <span class="co-column-chart__skeleton-yaxis-label"></span>
          <span class="co-column-chart__skeleton-yaxis-label"></span>
        </div>
        <!-- Columns skeleton -->
        <div class="co-column-chart__skeleton-columns">
          @for (col of skeletonColumns; track col) {
            <div class="co-column-chart__skeleton-column-group">
              @for (s of skeletonSeriesItems; track s) {
                <div
                  class="co-column-chart__skeleton-bar"
                  [style.height.%]="30 + (s * 20) + (col * 5) % 40"
                ></div>
              }
            </div>
          }
        </div>
      </div>
    } @else {
      <div class="co-column-chart__chart-container">
        <apx-chart
          #chart
          [series]="chartSeries()"
          [chart]="chartConfig"
          [colors]="chartColors()"
          [dataLabels]="dataLabelsConfig"
          [plotOptions]="plotOptionsConfig"
          [tooltip]="tooltipConfig"
          [states]="statesConfig"
          [legend]="legendConfig"
          [xaxis]="xAxisConfig"
          [yaxis]="yAxisConfig"
          [grid]="gridConfig"
          [stroke]="strokeConfig"
          [responsive]="responsiveConfig"
        />
      </div>
    }
  </div>

  <!-- Legend -->
  @if (showLegend) {
    @if (loading) {
      <div class="co-chart-legend-skeleton">
        @for (i of skeletonSeriesItems; track i) {
          <div class="co-chart-legend-skeleton__item">
            <span class="co-chart-legend-skeleton__dot"></span>
            <span class="co-chart-legend-skeleton__text"></span>
          </div>
        }
      </div>
    } @else {
      <co-chart-legend
        [items]="legendItems()"
        [showValues]="false"
        [valueFormat]="valueFormat"
        [size]="size === 'sm' ? 'sm' : size === 'lg' ? 'lg' : 'md'"
        (itemHover)="onLegendItemHover($event)"
        (itemLeave)="onLegendItemLeave()"
        (itemClick)="onLegendItemClick($event.index)"
      />
    }
  }
</div>
