<div
  class="co-donut-chart"
  [class.co-donut-chart--loading]="loading"
  [class.co-donut-chart--hovering]="hoveredIndex() !== -1 && !isLegendHover()"
>
  <div class="co-donut-chart__content">
    <!-- Chart Container -->
    <div class="co-donut-chart__chart-wrapper">
      @if (loading) {
        <div class="co-donut-chart__skeleton">
          <svg class="co-donut-chart__skeleton-donut" viewBox="0 0 100 100">
            <!-- Donut segments skeleton -->
            <circle cx="50" cy="50" r="40" fill="none" stroke-width="18"
              class="co-donut-chart__skeleton-segment co-donut-chart__skeleton-segment--1"
              stroke-dasharray="62.8 188.4" stroke-dashoffset="0" />
            <circle cx="50" cy="50" r="40" fill="none" stroke-width="18"
              class="co-donut-chart__skeleton-segment co-donut-chart__skeleton-segment--2"
              stroke-dasharray="50.2 200.9" stroke-dashoffset="-62.8" />
            <circle cx="50" cy="50" r="40" fill="none" stroke-width="18"
              class="co-donut-chart__skeleton-segment co-donut-chart__skeleton-segment--3"
              stroke-dasharray="75.4 175.8" stroke-dashoffset="-113" />
            <circle cx="50" cy="50" r="40" fill="none" stroke-width="18"
              class="co-donut-chart__skeleton-segment co-donut-chart__skeleton-segment--4"
              stroke-dasharray="62.8 188.4" stroke-dashoffset="-188.4" />
          </svg>
        </div>
      } @else {
        <div
          class="co-donut-chart__chart-container"
          [style.width.px]="height"
          [style.height.px]="height"
        >
          <apx-chart
            #chart
            [series]="chartSeries()"
            [chart]="chartConfig"
            [labels]="chartLabels()"
            [colors]="chartColors()"
            [dataLabels]="dataLabelsConfig"
            [plotOptions]="plotOptionsConfig"
            [tooltip]="tooltipConfig"
            [states]="statesConfig"
            [legend]="legendConfig"
            [stroke]="strokeConfig"
            [responsive]="responsiveConfig"
          />

          <!-- Center Text Overlay -->
          @if (centerText) {
            <div class="co-donut-chart__center">
              <span class="co-donut-chart__center-text">{{ centerText }}</span>
            </div>
          }
        </div>
      }
    </div>

    <!-- Legend -->
    @if (showLegend) {
      @if (loading) {
        <div class="co-chart-legend-skeleton">
          @for (i of skeletonItems; track i) {
            <div class="co-chart-legend-skeleton__item">
              <span class="co-chart-legend-skeleton__dot"></span>
              <span class="co-chart-legend-skeleton__text"></span>
            </div>
          }
        </div>
      } @else {
        <co-chart-legend
          [items]="legendItems()"
          [showValues]="showLegendValues"
          [valueFormat]="valueFormat"
          (itemHover)="onLegendItemHover($event)"
          (itemLeave)="onLegendItemLeave()"
          (itemClick)="onLegendItemClick($event.index)"
        />
      }
    }
  </div>
</div>
