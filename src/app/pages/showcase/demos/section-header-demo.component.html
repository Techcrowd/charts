<!-- ═══ SINGLE LINE ═══ -->
<div class="demo-section">
  <div class="demo-label">Single line</div>

  <div class="section-header">
    <!-- Avatar -->
    <div class="avatar">
      <span class="avatar-icon">&#x1F464;</span>
    </div>
    <!-- Title: leading-8 (32px) matches avatar height → looks centered with items-start -->
    <h6 class="title">Nadpis sekce</h6>
    <!-- Microbutton -->
    <button class="microbutton" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </svg>
    </button>
    <!-- Actions -->
    <div class="actions">
      <button class="btn-secondary">Stáhnout</button>
      <button class="btn-menu">⋮</button>
    </div>
  </div>
</div>
